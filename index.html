<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Survival Arena - 主選單</title>
    <script>
        // 登入檢查：如果沒有暱稱，跳轉回登入頁面
        if (!localStorage.getItem('playerNickname')) {
            window.location.href = 'login.html';
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #003333 0%, #000000 100%);
        }

        /* 動態背景星空效果 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .menu-container {
            position: relative;
            text-align: center;
            z-index: 10;
            padding: 50px;
            background: rgba(0, 20, 20, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.15), inset 0 0 20px rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            width: 400px;
        }

        /* 科技感裝飾角 */
        .menu-container::before, .menu-container::after,
        .corner-br, .corner-bl {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #00ffff;
            pointer-events: none;
        }
        .menu-container::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .menu-container::after { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }

        h1 {
            font-size: 3.2em;
            color: #00ffff;
            margin: 0;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
            letter-spacing: 6px;
            font-weight: 900;
        }
        .subtitle {
            margin-top: 5px;
            margin-bottom: 35px;
            opacity: 0.9;
            font-size: 0.9em;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
        }
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin: 0 auto;
        }
        .nav-btn {
            padding: 14px;
            font-size: 1.05em;
            background: rgba(0, 255, 255, 0.03);
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-align: center;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        .nav-btn::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }
        .nav-btn:hover::before { left: 100%; }
        .nav-btn:hover {
            background: rgba(0, 255, 255, 0.15);
            border-color: #00ffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3);
            color: white;
        }
        .nav-btn.primary {
            background: #00ffff;
            color: #001a1a;
            border: none;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }
        .nav-btn.primary:hover {
            background: #ffffff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
        }
        .user-info {
            margin-bottom: 25px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: #00ffff;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .logout-link {
            font-size: 0.8em;
            color: #ff5555;
            text-decoration: none;
            cursor: pointer;
            padding: 2px 8px;
            border: 1px solid rgba(255, 85, 85, 0.3);
            border-radius: 4px;
            transition: 0.2s;
        }
        .logout-link:hover {
            background: #ff5555;
            color: white;
        }
        .stats-preview {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 255, 0.1);
            font-size: 1.1em;
            color: #ffff00;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.3);
        }
        /* 導航列樣式 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 10, 10, 0.9);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .navbar a {
            color: #00ffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
            opacity: 0.9;
            letter-spacing: 2px;
        }
        .navbar a:hover {
            opacity: 1;
            text-shadow: 0 0 10px #00ffff;
        }
        .navbar a.active {
            opacity: 1;
            color: #fff;
            border-bottom: 2px solid #00ffff;
        }

        /* 載入畫面樣式 - 強化美化版 */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #001a1a 0%, #000 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
        }
        #loading-overlay::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10000;
        }
        .loading-box {
            width: 450px;
            text-align: center;
            position: relative;
            padding: 40px;
            border: 1px solid rgba(0, 255, 255, 0.1);
            background: rgba(0, 20, 20, 0.5);
            backdrop-filter: blur(5px);
        }
        .loading-text {
            color: var(--neon-blue);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5em;
            font-weight: 900;
            letter-spacing: 6px;
            margin-bottom: 30px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-blue);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }
        .loading-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 0;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }
        #loading-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #004444, var(--neon-blue));
            box-shadow: 0 0 20px var(--neon-blue);
            transition: width 0.1s linear;
            position: relative;
        }
        #loading-bar-fill::after {
            content: "";
            position: absolute;
            top: 0; right: 0; width: 10px; height: 100%;
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }
        #loading-percentage {
            margin-top: 15px;
            color: var(--neon-blue);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1em;
            font-weight: bold;
            opacity: 0.9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .loading-decoration {
            position: absolute;
            font-size: 10px;
            color: rgba(0, 255, 255, 0.3);
            font-family: monospace;
            text-transform: uppercase;
        }
        .top-left { top: 10px; left: 10px; }
        .bottom-right { bottom: 10px; right: 10px; }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="loading-box">
            <div class="loading-decoration top-left">System Auth: Verified</div>
            <div class="loading-text" id="loading-status">INITIALIZING</div>
            <div class="loading-bar-bg">
                <div id="loading-bar-fill"></div>
            </div>
            <div id="loading-percentage">
                <span>PROGRESS</span>
                <span id="percent-num">0%</span>
            </div>
            <div class="loading-decoration bottom-right">Cyber-Core v2.4.0</div>
        </div>
    </div>
    <nav class="navbar">
        <a href="index.html" class="active">HOME</a>
        <a href="game.html">BATTLE</a>
        <a href="skills.html">SKILLS</a>
        <a href="features.html">FEATURES</a>
        <a href="game.html?openShop=true">SHOP</a>
        <a href="tutorial.html">TUTORIAL</a>
        <a href="leaderboard.html">RANKING</a>
        <a href="credits.html">ABOUT</a>
        <a href="#" onclick="toggleLanguage()" id="lang-toggle" style="margin-left: auto; color: var(--neon-yellow); opacity: 0.8;">English</a>
    </nav>
    <script src="/socket.io/socket.io.js"></script>
    <script src="translations.js"></script>

    <div class="bg-animation" id="bg-stars"></div>
    <div class="menu-container">
        <div class="corner-br"></div>
        <div class="corner-bl"></div>
        <h1 data-i18n="main-title">ARENA</h1>
        <p class="subtitle" data-i18n="main-subtitle">3D Survival Multiplayer</p>
        
        <div class="user-info">
            <span>👤 <span id="display-nickname" data-i18n="main-player">玩家</span></span>
            <span class="logout-link" onclick="logout()" data-i18n="main-logout">LOGOUT</span>
        </div>

        <div class="nav-buttons">
            <a href="javascript:void(0)" onclick="startLoadingGame()" class="nav-btn primary" data-i18n="main-start">LAUNCH GAME</a>
            <a href="tutorial.html" class="nav-btn" data-i18n="main-tutorial">HOW TO PLAY</a>
            <a href="leaderboard.html" class="nav-btn" data-i18n="main-rank-btn">LEADERBOARD</a>
        </div>

        <div class="stats-preview">
            🪙 <span id="coin-display">300</span> | 🔑 <span id="key-display">300</span>
        </div>
    </div>

    <script>
        // 生成背景星星
        const bg = document.getElementById('bg-stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            const size = Math.random() * 3 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
            bg.appendChild(star);
        }

        // 從本地存儲獲取與暱稱綁定的進度
        const currentNickname = localStorage.getItem('playerNickname') || 'guest';
        const savedKeysRaw = localStorage.getItem(currentNickname + '_game_keys');
        const savedKeys = savedKeysRaw !== null ? savedKeysRaw : '300';
        const savedCoinsRaw = localStorage.getItem(currentNickname + '_game_coins');
        const savedCoins = savedCoinsRaw !== null ? savedCoinsRaw : savedKeys;
        
        document.getElementById('key-display').innerText = savedKeys;
        document.getElementById('coin-display').innerText = savedCoins;
        document.getElementById('display-nickname').textContent = currentNickname;

        function startLoadingGame() {
            const overlay = document.getElementById('loading-overlay');
            const barFill = document.getElementById('loading-bar-fill');
            const percentNum = document.getElementById('percent-num');
            const statusText = document.getElementById('loading-status');
            
            overlay.style.display = 'flex';
            let progress = 0;
            
            const messages = [
                "ESTABLISHING LINK",
                "SYNCING DATA-STREAM",
                "LOADING VIRTUAL ASSETS",
                "CALIBRATING NEURAL CORE",
                "ACCESS GRANTED"
            ];

            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 6) + 3; // 3-9%
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        window.location.href = 'game.html';
                    }, 500);
                }
                
                barFill.style.width = progress + '%';
                if (percentNum) percentNum.innerText = progress + '%';
                
                // 根據進度切換文字
                const msgIndex = Math.min(messages.length - 1, Math.floor(progress / 20));
                statusText.innerText = messages[msgIndex];
                
            }, 100); 
        }

        function logout() {
            if (confirm('確定要登出並更改暱稱嗎？')) {
                localStorage.removeItem('playerNickname');
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
