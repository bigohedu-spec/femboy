<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Survival Arena - 登入</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #002222 0%, #000 100%);
        }
        .login-container {
            text-align: center;
            z-index: 10;
            padding: 50px;
            background: rgba(0, 15, 15, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            width: 350px;
            position: relative;
        }
        .login-container::before {
            content: ""; position: absolute; top: -2px; left: -2px; width: 20px; height: 20px;
            border-top: 2px solid #00ffff; border-left: 2px solid #00ffff;
        }
        .login-container::after {
            content: ""; position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px;
            border-bottom: 2px solid #00ffff; border-right: 2px solid #00ffff;
        }
        h1 {
            font-size: 2.5em;
            color: #00ffff;
            margin: 0 0 5px 0;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            letter-spacing: 5px;
            font-weight: 900;
        }
        .subtitle {
            margin-bottom: 35px;
            opacity: 0.5;
            font-size: 0.8em;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #00ffff;
            font-size: 0.75em;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px;
            background: rgba(0, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 2px;
            color: white;
            font-size: 1em;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            letter-spacing: 1px;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: #00ffff;
            border: none;
            color: black;
            font-size: 1em;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }
        .login-btn:hover {
            background: white;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            padding-bottom: 15px;
        }
        .mode-btn {
            background: none;
            border: none;
            color: #00ffff;
            font-size: 0.8em;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0.4;
            transition: 0.3s;
            padding: 5px 10px;
            text-transform: uppercase;
        }
        .mode-btn.active {
            opacity: 1;
            border-bottom: 2px solid #00ffff;
            font-weight: bold;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 0.7em;
            opacity: 0.3;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 id="main-title" data-i18n="login-title">LOGIN</h1>
        <div class="subtitle" id="main-subtitle" data-i18n="login-desc">Enter the 3D Survival Arena</div>
        
        <div class="mode-toggle">
            <button class="mode-btn active" id="btn-login-mode" onclick="setMode('login')">LOGIN</button>
            <button class="mode-btn" id="btn-signup-mode" onclick="setMode('signup')">CREATE ACCOUNT</button>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="nickname" data-i18n="login-input">OPERATOR NICKNAME</label>
                <input type="text" id="nickname" data-i18n="login-input" placeholder="ENTER NAME..." required maxlength="15" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password" data-i18n="login-password">ACCESS PASSWORD</label>
                <input type="password" id="password" data-i18n="login-password-placeholder" placeholder="ENTER PASSWORD..." required maxlength="20">
            </div>
            <button type="submit" id="submit-btn" class="login-btn" data-i18n="login-btn">ACCESS SYSTEM</button>
        </form>
        
        <div style="margin-top: 20px;">
            <a href="#" onclick="toggleLanguage()" id="lang-toggle" style="color: #00ffff; text-decoration: none; font-size: 0.8em; opacity: 0.8;">English</a>
        </div>

        <div class="footer-note" id="footer-note" data-i18n="login-note">
            💡 New Operators: Password sets on first login
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="translations.js"></script>
    <script>
        const socket = io();
        let isRedirecting = false;
        let currentMode = 'login';

        function setMode(mode) {
            currentMode = mode;
            const lang = localStorage.getItem('gameLanguage') || 'zh';
            const isZh = lang === 'zh';
            
            // 更新按鈕狀態
            document.getElementById('btn-login-mode').classList.toggle('active', mode === 'login');
            document.getElementById('btn-signup-mode').classList.toggle('active', mode === 'signup');
            
            // 更新文字內容
            const title = document.getElementById('main-title');
            const submitBtn = document.getElementById('submit-btn');
            const note = document.getElementById('footer-note');

            if (mode === 'signup') {
                title.innerText = isZh ? "註冊帳號" : "CREATE ACCOUNT";
                submitBtn.innerText = isZh ? "建立並登入" : "CREATE & ACCESS";
                note.innerText = isZh ? "💡 請記住您的密碼，之後登入需使用" : "💡 Remember your password for future access";
            } else {
                title.innerText = isZh ? "登入系統" : "LOGIN";
                submitBtn.innerText = isZh ? "存取系統" : "ACCESS SYSTEM";
                note.innerText = isZh ? "💡 遺失密碼將無法救回存檔" : "💡 Lost passwords cannot be recovered";
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nickname = document.getElementById('nickname').value.trim();
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            
            if (nickname && password && !isRedirecting) {
                isRedirecting = true;
                const originalBtnText = btn.innerText;
                btn.innerText = "ACCESSING...";
                btn.disabled = true;

                // [修復] 清除舊有的快取資料，確保登入的是新帳號
                localStorage.removeItem('playerNickname');
                localStorage.removeItem('playerPassword');

                // 檢查本地是否有「該暱稱專屬」的舊存檔資料 (遷移邏輯)
                const localKeys = localStorage.getItem(nickname + '_game_keys');
                let migrationData = null;
                if (localKeys) {
                    migrationData = {
                        keys: parseInt(localKeys) || 300,
                        unlockedWeapons: JSON.parse(localStorage.getItem(nickname + '_game_unlocked_weapons')) || ['rifle', 'pistol'],
                        kills: parseInt(localStorage.getItem(nickname + '_game_kills')) || 0,
                        xp: parseInt(localStorage.getItem(nickname + '_game_xp')) || 0,
                        level: parseInt(localStorage.getItem(nickname + '_game_level')) || 1,
                        weaponKills: JSON.parse(localStorage.getItem(nickname + '_game_weapon_kills')) || {},
                        unlockedSkills: JSON.parse(localStorage.getItem(nickname + '_game_unlocked_skills')) || []
                    };
                }

                // 向伺服器登入 (傳送密碼與模式)
                socket.emit('login', { 
                    nickname, 
                    password, 
                    isSignup: currentMode === 'signup',
                    migrationData 
                });

                // 設定超時警告 (但不自動進入)
                const timeout = setTimeout(() => {
                    if (!isRedirecting) return;
                    isRedirecting = false;
                    btn.innerText = originalBtnText;
                    btn.disabled = false;
                    alert("Server Timeout / 伺服器連線超時，請檢查網路或稍後重試 (Render 冷啟動可能需要較長時間)");
                }, 15000); // 增加到 15 秒

                // 接收伺服器傳回的錯誤
                socket.once('loginError', function(error) {
                    clearTimeout(timeout);
                    isRedirecting = false;
                    btn.innerText = originalBtnText;
                    btn.disabled = false;
                    
                    const lang = localStorage.getItem('gameLanguage') || 'zh';
                    if (error === 'wrong_password') {
                        alert(translations[lang]['login-error-pass'] || "Wrong Password");
                    } else if (error === 'user_already_exists') {
                        alert(lang === 'zh' ? "此暱稱已被使用，請更換或切換至登入模式" : "Username already exists. Please choose another or login.");
                    } else if (error === 'user_not_found') {
                        alert(lang === 'zh' ? "找不到此帳號，請切換至註冊模式建立" : "Account not found. Please switch to Sign-up mode.");
                    } else if (error === 'server_internal_error') {
                        alert("伺服器內部錯誤，請聯繫開發者");
                    } else {
                        alert("登入失敗: " + error);
                    }
                });

                // 修改：統一處理成功邏輯，避免重複監聽
                socket.once('loginSuccess', function(response) {
                    clearTimeout(timeout);
                    handleLoginSuccess(response);
                });
            }
        });

        function handleLoginSuccess(response) {
            const nickname = response.nickname;
            const data = response.data;
            const password = document.getElementById('password').value; 
            
            console.log("從伺服器收到資料:", data);

            localStorage.setItem('playerNickname', nickname);
            localStorage.setItem('playerPassword', password); 
            localStorage.setItem(nickname + '_game_keys', data.keys);
            localStorage.setItem(nickname + '_game_unlocked_weapons', JSON.stringify(data.unlockedweapons || data.unlockedWeapons));
            localStorage.setItem(nickname + '_game_unlocked_skills', JSON.stringify(data.unlockedskills || data.unlockedSkills || []));
            localStorage.setItem(nickname + '_game_kills', data.total_kills || data.kills || 0);
            localStorage.setItem(nickname + '_game_xp', data.xp || 0);
            localStorage.setItem(nickname + '_game_level', data.level || 1);
            localStorage.setItem(nickname + '_game_weapon_kills', JSON.stringify(data.weapon_kills || data.weaponKills || {}));
            
            if (data.achievements) {
                localStorage.setItem(nickname + '_game_achievements', JSON.stringify(data.achievements));
            }
            
            localStorage.removeItem('game_keys');
            localStorage.removeItem('game_unlocked_weapons');
            
            window.location.href = 'index.html';
        }

        // 如果已經登入了，直接跳轉
        window.onload = function() {
            if (localStorage.getItem('playerNickname')) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
